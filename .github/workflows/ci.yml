name: Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A push and a pull request for one branch need one run, not two.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      # npm test builds first, then runs the engine, worker, bundle and parity suites.
      # The parity suite runs the same workflow through the worker of the page and through the
      # dl command, and compares the bytes.
      - name: Tests
        run: npm test

      # The tests hold the engine to its word. This holds the command to its word: it must read a
      # file, run the steps and write the right answer, the way a person uses it.
      - name: The dl command reads, runs and writes
        run: bash .github/smoke.sh node dist/dl.mjs

      # GitHub Pages serves the files of the repository and has no build step, so
      # dist/engine.global.js is committed. It must match the sources at this commit.
      - name: The committed engine matches its source
        run: |
          if ! git diff --quiet --exit-code -- dist/engine.global.js; then
            echo "::error::dist/engine.global.js does not match packages/engine/src. Run: npm run build"
            exit 1
          fi

  # The desktop application must start on every push. This makes no installer, which takes
  # minutes on each platform. It starts the application from the source in desktop/ and asks it
  # to check itself. The --smoke flag loads the page, starts the worker, and stops with 0 or 1.
  # The packaged application, with its own resources path, is checked by the release only.
  desktop:
    name: The desktop application starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci
        working-directory: desktop

      # The runner has no display, so xvfb-run gives the application one that is not shown. Ubuntu
      # 24.04 stops a program without a profile from making a user namespace. The sandbox of
      # Chromium needs one, so the sandbox is off in this check only. The check is about the page
      # and the worker, not the sandbox. The engine is committed, so the page stages with no build.
      - name: Check that the application starts
        working-directory: desktop
        run: xvfb-run -a npm start -- --smoke --no-sandbox
