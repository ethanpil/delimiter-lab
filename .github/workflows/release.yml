name: Release

# Runs when a tag that starts with v is pushed, for example v1.0.
# It builds the dl command for every platform, the desktop application for macOS and Windows,
# and the web edition. It packs them and puts the files on the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to build, for example v1.0'
        required: true
      ref:
        description: 'The branch or commit to build. Empty takes the tag. Give a branch for a dry run, with publish off.'
        required: false
        default: ''
      publish:
        description: 'Publish the release. Turn it off for a dry run. The run then builds and checks everything, and writes nothing to the releases page.'
        type: boolean
        default: true

# Only the job that publishes needs the right to write. The jobs that build get no more than
# the right to read, because that is where code from other people runs.
permissions:
  contents: read

# Two tags pushed together would write the same release, so one run waits for the other.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # What every job checks out. A run by hand takes the ref that it names, or the tag. A push
  # takes the tag that was pushed.
  REF: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------- one build for every platform
  binaries:
    name: Build the binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # A branch is not the tag. A run that builds a branch must not put its files on the release
      # of the tag. It stops here, in seconds, and not after the builds.
      - name: A run of a branch is a dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.publish }}
        run: |
          echo "::error::ref names a branch, so this run does not build the tag. Turn publish off, or leave ref empty."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # The tests must pass before anything is built for a release. The parity suite is the one
      # that says the command and the page give the same answer.
      - name: Tests
        run: npm test

      # The desktop application and the web edition take the committed engine, and the dl command
      # takes the build that the tests made. The two must be the same, or the editions differ.
      - name: The committed engine matches its source
        run: |
          if ! git diff --quiet --exit-code -- dist/engine.global.js; then
            echo "::error::dist/engine.global.js does not match packages/engine/src. Run: npm run build"
            exit 1
          fi

      # The name of the tag never reaches the shell as text, so nothing in it can run.
      - name: The version of the tag and the version of the application must agree
        id: version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*DL\.VERSION = '\([^']*\)'.*/\1/p" js/manifest.js)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG but js/manifest.js says $version. They must agree."
            exit 1
          fi
          echo "Building version $version"

      # Bun puts its runtime inside the binary. A version below 1.2.4 does not sign a macOS
      # binary again after it adds that runtime, and an unsigned binary does not start on an
      # Apple silicon machine.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.2.4'

      # One machine builds every target, so every platform comes from one source and one build.
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p out
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            # Bun says darwin. The file says macos, because that is the name that people know, and
            # it makes the names of the Mac files match the names of the Linux files.
            name="dl-${target/darwin/macos}"
            case "$target" in windows-*) name="$name.exe" ;; esac
            echo "--- $target"
            bun build --compile --minify --target="bun-$target" ./dist/dl.mjs --outfile "out/$name"
          done
          ls -la out

      - name: Check that the Linux binary reads, runs and writes
        run: |
          set -euo pipefail
          chmod +x out/dl-linux-x64
          ./out/dl-linux-x64 --version
          ./out/dl-linux-x64 --help > /dev/null
          bash .github/smoke.sh ./out/dl-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: raw-binaries
          path: out/*
          retention-days: 7
          overwrite: true

  # ---------------------------------------------------------------- the two Mac binaries
  macos:
    name: Check the Mac binaries
    needs: binaries
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/download-artifact@v4
        with:
          name: raw-binaries
          path: out

      # An artifact does not carry the right to run, so the right comes back here.
      # There are two files, one for each kind of Mac, as there are for Linux. Both are checked.
      - name: Check
        run: |
          set -euo pipefail
          chmod +x out/dl-macos-x64 out/dl-macos-arm64
          echo "--- Apple silicon"
          ./out/dl-macos-arm64 --version
          bash .github/smoke.sh ./out/dl-macos-arm64
          # The runner has an Apple silicon chip. When it can also run Intel code, the Intel file
          # is checked too, so that both files are known to work.
          #
          # The Intel file says "CPU lacks AVX support, strange crashes may occur" in this check.
          # Rosetta does not give AVX to the code it runs. A real Intel Mac has AVX, so the message
          # belongs to the check and not to the file. Do not change the build for it.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "--- Intel"
            arch -x86_64 ./out/dl-macos-x64 --version
            arch -x86_64 bash .github/smoke.sh ./out/dl-macos-x64
          else
            echo "::warning::This runner cannot run Intel code, so the Intel file was not checked."
          fi

  # ---------------------------------------------------------------- the Windows binary
  windows:
    name: Check the Windows binary
    needs: binaries
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/download-artifact@v4
        with:
          name: raw-binaries
          path: out

      - name: Check that it reads, runs and writes
        shell: bash
        run: |
          set -euo pipefail
          ./out/dl-windows-x64.exe --version
          bash .github/smoke.sh ./out/dl-windows-x64.exe

  # ---------------------------------------------------------------- the desktop application, macOS
  desktop-macos:
    name: Build the desktop application for macOS
    needs: binaries
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.binaries.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      # The desktop application is an npm project of its own, with its own lock file.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci
        working-directory: desktop

      # The build stages the page first. The engine is committed, so this needs no npm ci at the
      # root. One command makes the disk image for each chip.
      - name: Build
        run: npm run build
        working-directory: desktop

      # The names come from electron-builder.yml, with the version of js/manifest.js, as the dl
      # files are named. A wrong name stops the run here and not at the release.
      - name: The names of the files match the notes of the release
        run: |
          set -euo pipefail
          ls -la desktop/out
          test -f "desktop/out/delimiter-lab-$VERSION-macos-arm64.dmg"
          test -f "desktop/out/delimiter-lab-$VERSION-macos-x64.dmg"

      # --smoke starts the application, loads the page, starts the worker and stops, with 0 when
      # both work. The runner has an Apple silicon chip, so that build runs as it is. The Intel
      # build runs under Rosetta when the runner has it, as the check of the dl command does.
      - name: Check that the application starts
        run: |
          set -euo pipefail
          echo "--- Apple silicon"
          "desktop/out/mac-arm64/Delimiter Lab.app/Contents/MacOS/Delimiter Lab" --smoke
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "--- Intel"
            arch -x86_64 "desktop/out/mac/Delimiter Lab.app/Contents/MacOS/Delimiter Lab" --smoke
          else
            echo "::warning::This runner cannot run Intel code, so the Intel application was not checked."
          fi

      # The artifact holds the two disk images only. A disk image is compressed, so the artifact is not compressed again.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: desktop/out/delimiter-lab-*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  # ---------------------------------------------------------------- the desktop application, Windows
  desktop-windows:
    name: Build the desktop application for Windows
    needs: binaries
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.binaries.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        run: npm ci
        working-directory: desktop

      - name: Build
        run: npm run build
        working-directory: desktop

      - name: The names of the files match the notes of the release
        shell: bash
        run: |
          set -euo pipefail
          ls -la desktop/out
          test -f "desktop/out/delimiter-lab-$VERSION-windows-x64-setup.exe"
          test -f "desktop/out/delimiter-lab-$VERSION-windows-x64.zip"

      # A Windows program with a window does not hold the console that started it. A shell can
      # continue before the program ends and not get the exit code. Start-Process -Wait waits for
      # the end and returns the exit code. The two files hold what the program said.
      - name: Check that the application starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "desktop\out\win-unpacked\Delimiter Lab.exe" -ArgumentList '--smoke' -Wait -PassThru -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          Get-Content smoke.out, smoke.err
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::The application did not start. Exit code $($p.ExitCode)."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            desktop/out/delimiter-lab-*-setup.exe
            desktop/out/delimiter-lab-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  # ---------------------------------------------------------------- the packages
  packages:
    name: Make the packages
    needs: [binaries, macos, windows, desktop-macos, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.binaries.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/download-artifact@v4
        with:
          name: raw-binaries
          path: out

      # The desktop files go into release/ as they are, so the list of checksums covers them too.
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Get nfpm
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz
          echo "b3cf95aa6dabed836d09ad7f0c190a13c74c5b1304db60846f0f702ee407f430  /tmp/nfpm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      # One description makes the Debian, the Red Hat and the Alpine package, for both chips.
      # nfpm looks for the file of a package beside the place where it runs, not beside its own
      # description, so the description names packaging/dl and this step runs from the root.
      - name: Build deb, rpm and apk
        run: |
          set -euo pipefail
          mkdir -p release
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) src=out/dl-linux-x64 ;;
              arm64) src=out/dl-linux-arm64 ;;
            esac
            chmod +x "$src"
            cp "$src" packaging/dl
            for kind in deb rpm apk; do
              ARCH="$arch" VERSION="$VERSION" nfpm package -f packaging/nfpm.yaml -p "$kind" -t release/
            done
            rm -f packaging/dl
          done
          ls -la release

      - name: Pack the plain binaries
        run: |
          set -euo pipefail
          cd out
          chmod +x dl-linux-x64 dl-linux-arm64 dl-macos-x64 dl-macos-arm64
          tar -czf "../release/dl-$VERSION-linux-x64.tar.gz" dl-linux-x64
          tar -czf "../release/dl-$VERSION-linux-arm64.tar.gz" dl-linux-arm64
          tar -czf "../release/dl-$VERSION-macos-x64.tar.gz" dl-macos-x64
          tar -czf "../release/dl-$VERSION-macos-arm64.tar.gz" dl-macos-arm64
          zip -q "../release/dl-$VERSION-windows-x64.zip" dl-windows-x64.exe
          cd ..
          ls -la release

      # The web edition is the tree that GitHub Pages serves, as one zip. zip runs in dist/web, so
      # index.html is at the root of the archive and not in a folder. The last line holds that
      # promise. The stage script runs on the Node of the runner, and the engine is committed, so
      # this needs no npm ci. grep reads the whole list. With -q it would stop at the first line,
      # and unzip would then stop with an error on a long list.
      - name: Pack the web edition
        run: |
          set -euo pipefail
          node scripts/stage-web.mjs
          (cd dist/web && zip -qr "../../release/delimiter-lab-$VERSION-web.zip" .)
          unzip -Z1 "release/delimiter-lab-$VERSION-web.zip" | grep -x index.html > /dev/null
          ls -la release

      # Only the files, so that a directory cannot stop the step half way. The list of checksums
      # is left out of itself: the shell makes that file empty before find looks, so a line for it
      # would hold the checksum of nothing and sha256sum -c would always say FAILED.
      - name: Write the checksums
        run: |
          set -euo pipefail
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      # The files are compressed already, so the artifact is not compressed again. A release
      # keeps the files on its page, so the artifact does not have to stay long.
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/*
          compression-level: 0
          retention-days: 7
          overwrite: true

  # ---------------------------------------------------------------- the release itself
  release:
    name: Publish the release
    needs: [binaries, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.binaries.outputs.version }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      # The names of the packages come from nfpm, so the instructions read the names off the files
      # that were really built. A name that is not there stops the step, because instructions that
      # name a file nobody can download are worse than no instructions. Two names are as bad as
      # none. The dl zip and the desktop zip both end in windows-x64.zip, so every pattern must
      # match one file only. The notes also go to the summary of the run, where a dry run reads them.
      - name: Write the notes
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          pick() {
            found=$(cd release && ls $1 2>/dev/null || true)
            count=$(printf '%s\n' "$found" | grep -c . || true)
            if [ "$count" != "1" ]; then
              echo "::error::$count files in the release match $1. The notes need exactly one." >&2
              exit 1
            fi
            echo "$found"
          }
          dmgArm=$(pick 'delimiter-lab-*-macos-arm64.dmg'); dmgIntel=$(pick 'delimiter-lab-*-macos-x64.dmg')
          winSetup=$(pick 'delimiter-lab-*-windows-x64-setup.exe'); winZip=$(pick 'delimiter-lab-*-windows-x64.zip')
          web=$(pick 'delimiter-lab-*-web.zip')
          deb=$(pick '*amd64.deb');      debArm=$(pick '*arm64.deb')
          rpm=$(pick '*x86_64.rpm');     rpmArm=$(pick '*aarch64.rpm')
          apk=$(pick '*x86_64.apk');     apkArm=$(pick '*aarch64.apk')
          mac=$(pick 'dl-*-macos-arm64.tar.gz'); macIntel=$(pick 'dl-*-macos-x64.tar.gz')
          lin=$(pick 'dl-*-linux-x64.tar.gz'); linArm=$(pick 'dl-*-linux-arm64.tar.gz')
          win=$(pick 'dl-*-windows-x64.zip')
          {
            echo "Delimiter Lab comes in three editions. All of them run one engine, built from one"
            echo "source, so they give the same answer. No data leaves the computer in any of them."
            echo
            echo "- The desktop application: the page in a window of its own, for macOS and Windows."
            echo "- The web edition: the page as files, for your own web server. The published copy runs"
            echo "  at https://ethanpil.github.io/delimiter-lab/."
            echo "- The \`dl\` command: runs a workflow on files from a terminal."
            echo
            echo "## Desktop application"
            echo
            echo "### macOS"
            echo
            echo "Take the file for your chip. \`uname -m\` says \`arm64\` for Apple silicon and"
            echo "\`x86_64\` for Intel."
            echo
            echo "- Apple silicon: [$dmgArm]($base/$dmgArm)"
            echo "- Intel: [$dmgIntel]($base/$dmgIntel)"
            echo
            echo "Open the file. Drag Delimiter Lab to Applications. Apple has not notarized the"
            echo "application, so the first start stops with a message. Then open System Settings >"
            echo "Privacy & Security. Find Delimiter Lab near the bottom of the page. Click Open Anyway."
            echo "Or remove the quarantine attribute from a terminal, then start the application again:"
            echo '```'
            echo "xattr -dr com.apple.quarantine \"/Applications/Delimiter Lab.app\""
            echo '```'
            echo
            echo "### Windows"
            echo
            echo "- Installer: [$winSetup]($base/$winSetup)"
            echo "- Without installation: [$winZip]($base/$winZip). Unpack it. Start \`Delimiter Lab.exe\` in the folder."
            echo
            echo "The application is not signed, so SmartScreen says \"Windows protected your PC\" at"
            echo "the first start. Click \"More info\", then \"Run anyway\"."
            echo
            echo "## Web edition"
            echo
            echo "[$web]($base/$web) holds the page as files. Unpack it. Serve the folder from any"
            echo "web server:"
            echo '```'
            echo "unzip $web -d delimiter-lab"
            echo "cd delimiter-lab"
            echo "python -m http.server 8765"
            echo '```'
            echo "Then open http://localhost:8765. The page needs a web server: a browser does not start"
            echo "the Web Worker from a \`file://\` address."
            echo
            echo "## The dl command"
            echo
            echo "\`dl\` runs a workflow on files from a terminal."
            echo
            echo '```'
            echo "dl workflow.json input.csv -o out.csv        # write a file"
            echo "dl workflow.json input.csv                   # write to standard output"
            echo "dl workflow.json jan.csv feb.csv -o q1.csv   # many files, one source"
            echo "dl workflow.json input.csv --dry-run         # run every step, write nothing"
            echo "dl workflow.json input.csv --validate        # check the workflow against the files"
            echo '```'
            echo
            echo "A workflow file comes from the page: open Workflows and use Export."
            echo
            echo "### Debian and Ubuntu"
            echo '```'
            echo "curl -LO $base/$deb"
            echo "sudo dpkg -i $deb"
            echo '```'
            echo "For a machine with an ARM chip, take \`$debArm\`."
            echo
            echo "### Fedora, Red Hat and SUSE"
            echo '```'
            echo "curl -LO $base/$rpm"
            echo "sudo rpm -i $rpm"
            echo '```'
            echo "For a machine with an ARM chip, take \`$rpmArm\`."
            echo
            echo "### Alpine"
            echo '```'
            echo "curl -LO $base/$apk"
            echo "apk add --allow-untrusted $apk"
            echo '```'
            echo "For a machine with an ARM chip, take \`$apkArm\`."
            echo
            echo "### macOS"
            echo
            echo "Take the file for your chip. \`uname -m\` says \`arm64\` for Apple silicon and"
            echo "\`x86_64\` for Intel."
            echo '```'
            echo "curl -LO $base/$mac"
            echo "tar -xzf $mac"
            echo "chmod +x dl-macos-arm64"
            echo "xattr -d com.apple.quarantine dl-macos-arm64   # macOS holds a downloaded file"
            echo "sudo mv dl-macos-arm64 /usr/local/bin/dl"
            echo '```'
            echo "For a Mac with an Intel chip, take \`$macIntel\` and use \`dl-macos-x64\` in place"
            echo "of \`dl-macos-arm64\` in those lines."
            echo
            echo "### Linux, without a package"
            echo '```'
            echo "curl -LO $base/$lin"
            echo "tar -xzf $lin"
            echo "chmod +x dl-linux-x64"
            echo "sudo mv dl-linux-x64 /usr/local/bin/dl"
            echo '```'
            echo "For a machine with an ARM chip, take \`$linArm\`."
            echo
            echo "### Windows"
            echo
            echo "Take \`$win\`, open it, and put \`dl-windows-x64.exe\` in a folder that is on your"
            echo "PATH. Name it \`dl.exe\` for the short name."
            echo
            echo "## Check a download"
            echo
            echo "\`SHA256SUMS.txt\` holds the checksum of every file here."
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo '```'
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # tag_name is given, because a run started by hand has a branch and not a tag.
      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          name: Delimiter Lab ${{ env.VERSION }}
          body_path: notes.md
          files: release/*
          draft: false
          prerelease: false
